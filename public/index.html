<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phoenix AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header>
      <div class="title-row">
        <h1>🔥 Phoenix AI</h1>
        <button type="button" id="reset" class="link-btn" hidden>Yeni sohbet</button>
      </div>
      <p class="sub">Ne okuyacağını ya da araştıracağını bilmiyor musun? Anlat, sana uygun konular, anahtar kelimeler veya kitaplar bulalım.</p>
    </header>

    <div id="chips" class="chips" aria-label="Örnek istekler">
      <button type="button" class="chip" data-text="Fizik dersi için ilgi çekici bir konu araştırmak istiyorum ama ne seçeceğimi bilmiyorum.">Ders araştırması</button>
      <button type="button" class="chip" data-text="Boş zamanlarımda okuyabileceğim ilginç konular arıyorum, kısa ve sürükleyici olsun.">Eğlence</button>
      <button type="button" class="chip" data-text="Üniversitede bilgisayar mühendisliği okuyorum, kariyerim için hangi konuları araştırmalıyım?">Kariyer</button>
    </div>

    <section id="chat" class="chat" aria-live="polite" hidden></section>

    <div id="loading" class="loading" hidden>
      <span class="spinner" aria-hidden="true"></span> Öneriler hazırlanıyor...
    </div>
    <div id="error" class="error" role="alert" hidden></div>

    <form id="form">
      <label for="message" class="sr-only">Mesajın</label>
      <textarea id="message" rows="3" maxlength="1000" placeholder="Örn: Lise 2'yim, tarihi seviyorum, ödev için konu arıyorum..."></textarea>
      <div class="row">
        <span id="count" class="count">0 / 1000</span>
        <button id="send" type="submit">Öner</button>
      </div>
    </form>
    <p class="note">Mesajlarına ad, okul, telefon gibi kişisel bilgilerini yazma. Yapay zekâ yanıtları yanlış olabilir, önerilen konuları kontrol et.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
